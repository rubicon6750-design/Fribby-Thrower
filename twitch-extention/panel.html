<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fribby Thrower Stats</title>
  <link rel="stylesheet" href="panel.css">
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="panel.js" defer></script>
</head>
<body>
  <main class="panel" aria-live="polite">
    <header class="header">
      <div class="mark" aria-hidden="true">F</div>
      <div class="heading">
        <h1>Fribby Thrower</h1>
        <p class="eyebrow">STREAM STATS</p>
      </div>
      <span id="liveDot" class="live-dot" hidden>LIVE</span>
    </header>
    <section class="stats" aria-label="Current game stats">
      <article class="stat primary">
        <span class="label">Fribbies</span>
        <strong id="fribbies">—</strong>
      </article>
      <article class="stat">
        <span class="label">Mega Fribbies</span>
        <strong id="megaFribbies">—</strong>
      </article>
      <article class="stat wide">
        <span class="label">Total Ascensions</span>
        <strong id="ascensions">—</strong>
      </article>
    </section>
    <p id="status" class="status">Waiting for this channel's stats configuration…</p>
    <p id="updated" class="updated"></p>
    <footer>Updates automatically while the game is open.</footer>
  </main>
</body>
</html>
